# Checked in CI with `cargo deny check`.

[graph]
# The platforms Lotype builds for; crates only used elsewhere are not checked.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[advisories]
unmaintained = "workspace"

[licenses]
# Permissive licenses, plus MPL-2.0, which stays within its own files.
# Nothing copyleft that would bind applications using the SDK.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
