[workspace]
resolver = "3"
members = ["crates/ai", "crates/code", "crates/core", "crates/lotype", "crates/server", "crates/storage", "crates/ui"]
exclude = ["porting"]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
homepage = "https://lotype.dev"
documentation = "https://docs.lotype.dev"
repository = "https://github.com/lotype/lotype"
keywords = ["editor", "wysiwyg", "wysiwym", "gpui", "crdt"]
categories = ["text-editors", "gui", "asynchronous"]

[workspace.dependencies]
# gpui-pre is GPUI as gpui-component 0.10 pins it; the platform crate is
# the application's choice, so it is only a dev-dependency here.
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui-component = "=0.10.0"
lotype-ai = { path = "crates/ai", version = "=0.1.0-alpha.0" }
lotype-code = { path = "crates/code", version = "=0.1.0-alpha.0" }
lotype-core = { path = "crates/core", version = "=0.1.0-alpha.0" }
lotype-server = { path = "crates/server", version = "=0.1.0-alpha.0" }
lotype-storage = { path = "crates/storage", version = "=0.1.0-alpha.0", default-features = false }
lotype-ui = { path = "crates/ui", version = "=0.1.0-alpha.0" }
loro = "1.19.0"
tokio = { version = "1.54.1", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
unicode-segmentation = "1.13.3"
