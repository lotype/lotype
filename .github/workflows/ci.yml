name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml, same as local.
      - run: rustup toolchain install
      - run: rustc --version
      - run: cargo fmt --all --check
      # lotype-ui needs macOS to run its tests; it is checked locally.
      - run: cargo clippy --workspace --exclude lotype-ui --all-targets -- -D warnings
      - run: cargo test --workspace --exclude lotype-ui
      - name: Max 600 lines per Rust file
        run: find crates -name '*.rs' -exec wc -l {} + | awk '$2 != "total" && $1 > 600 { print; bad = 1 } END { exit bad }'

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Same committed version as .githooks/commit-msg; rules live in committed.toml.
      - uses: crate-ci/committed@v1.1.12
        with:
          commits: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.21.0
      - run: cargo deny check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.90 --profile minimal
      # lotype-ui declares its own, newer rust-version, as GPUI needs it.
      - run: cargo +1.90 check --workspace --exclude lotype-ui
